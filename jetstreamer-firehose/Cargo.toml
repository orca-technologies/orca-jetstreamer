[package]
name = "jetstreamer-firehose"
description = "Support crate for Jetstreamer containing firehose ingestion engine and core abstractions"
keywords.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
default-run = "jetstreamer-firehose"
repository.workspace = true
documentation.workspace = true

[features]
default = []
# In-process Geyser plugins (`firehose_geyser`) and the `jetstreamer-firehose` binary. Pulls
# the Agave validator stack (solana-ledger · solana-runtime · solana-rpc), so it is opt-in.
geyser = [
    "dep:crossbeam-channel",
    "crossbeam-channel/std",
    "dep:solana-accounts-db",
    "dep:solana-entry",
    "dep:solana-geyser-plugin-manager",
    "dep:solana-ledger",
    "dep:solana-rpc",
    "dep:solana-runtime",
]
verify-transaction-signatures = []
s3-backend = [
    "aws-credential-types",
    "aws-sdk-s3",
    "aws-smithy-types",
    "aws-types",
]

[[bin]]
name = "jetstreamer-firehose"
path = "src/main.rs"
required-features = ["geyser"]

[dependencies]
crossbeam-channel = { workspace = true, optional = true }
serial_test.workspace = true
solana-rpc = { workspace = true, optional = true }
solana-runtime = { workspace = true, optional = true }
solana-hash.workspace = true
solana-geyser-plugin-manager = { workspace = true, optional = true }
solana-storage-proto = { workspace = true, features = ["agave-unstable-api"] }
solana-address.workspace = true
solana-transaction.workspace = true
# blake3: `VersionedMessage::hash` for `TransactionData::message_hash`.
solana-message = { workspace = true, features = ["blake3"] }
solana-transaction-status.workspace = true
solana-ledger = { workspace = true, optional = true }
solana-signature.workspace = true
solana-sdk-ids.workspace = true
solana-accounts-db = { workspace = true, optional = true }
prost_014.workspace = true
solana-entry = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "stream"] }
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
bytes.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
cid.workspace = true
multihash.workspace = true
base64.workspace = true
wincode.workspace = true
solana-logger.workspace = true
log.workspace = true
ripget.workspace = true
crc.workspace = true
serde_cbor.workspace = true
fnv.workspace = true
serde_json.workspace = true
zstd.workspace = true
solana-reward-info.workspace = true
bincode.workspace = true
xxhash-rust.workspace = true
ahash.workspace = true
dashmap.workspace = true
once_cell.workspace = true
url.workspace = true
libc.workspace = true

aws-credential-types = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
serial_test = "3"
